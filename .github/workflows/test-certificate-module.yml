name: Certificate NS8 validation
on:
  workflow_dispatch:
    inputs:
      image:
        description: Existing candidate image whose production source matches the tested tree
        required: true
        type: string
permissions:
  contents: read
jobs:
  qemu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian13
            bootstrap: false
          - distro: rocky9
            bootstrap: true
    permissions:
      contents: read
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: ${{ matrix.distro }}
      image_url: ${{ !matrix.bootstrap && inputs.image || '' }}
      setup_cluster: ${{ !matrix.bootstrap }}
      coremodules: ${{ matrix.bootstrap && format('ghcr.io/nethserver/core:3.23.2 {0}', inputs.image) || '' }}
      args: ${{ matrix.bootstrap && inputs.image || '-v SCENARIO:install -v CERTIFICATE_TRANSPORT_TEST:True' }}
      repo_ref: ${{ github.sha }}
      version_tag: certificate-${{ github.sha }}
      install_args: ghcr.io/nethserver/core:3.23.2
      script: ${{ matrix.bootstrap && 'tests/ns8/bootstrap-rocky.sh' || '' }}
